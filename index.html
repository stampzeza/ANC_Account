<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<meta
name="theme-color"
content="#0F4C5C"

>

  <title>ANC Life Planning</title>

  <!-- LINE LIFF SDK -->

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: auto;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f5f7f8;
      color: #1f2933;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 92px;
    }

    .page {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
    }

    /* =========================================
       LOADING
    ========================================= */

    .loading-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .loading-box {
      width: 100%;
      max-width: 320px;
      text-align: center;
    }

    .loading-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: #0f4c5c;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .loading-title {
      font-size: 21px;
      font-weight: 800;
      color: #16323a;
      margin-bottom: 8px;
    }

    .loading-text {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
    }

    .spinner {
      width: 30px;
      height: 30px;
      margin: 20px auto 0;
      border: 3px solid #d9e2e6;
      border-top-color: #0f4c5c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================
       ERROR / WELCOME
    ========================================= */

    .error-screen,
    .welcome {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .error-box,
    .welcome-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 22px;
      padding: 30px 22px;
      text-align: center;
      box-shadow:
        0 8px 30px rgba(15, 76, 92, 0.08);
    }

    .error-icon,
    .welcome-icon {
      font-size: 44px;
      margin-bottom: 12px;
    }

    .error-title,
    .welcome-title {
      font-size: 21px;
      font-weight: 800;
      color: #16323a;
      margin-bottom: 10px;
    }

    .welcome-title {
      color: #0f4c5c;
    }

    .error-message,
    .welcome-text {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-line;
      word-break: break-word;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 800;
    }

    .btn-primary {
      margin-top: 18px;
      width: 100%;
      background: #0f4c5c;
      color: #fff;
    }

    /* =========================================
       HEADER
    ========================================= */

    .account-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .profile-image,
    .profile-placeholder {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .profile-image {
      object-fit: cover;
      background: #dfe8eb;
    }

    .profile-placeholder {
      background: #dfe8eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .account-greeting {
      flex: 1;
      min-width: 0;
    }

    .greeting {
      font-size: 13px;
      color: #6b7280;
    }

    .display-name {
      font-size: 20px;
      font-weight: 800;
      color: #0f4c5c;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .updated-text {
      margin-top: 3px;
      font-size: 11px;
      color: #9ca3af;
    }

    /* =========================================
       HERO
    ========================================= */

    .hero-card {
      background:
        linear-gradient(
          135deg,
          #0f4c5c,
          #17697b
        );
      color: #fff;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow:
        0 10px 28px rgba(15, 76, 92, 0.18);
    }

    .hero-label {
      font-size: 12px;
      opacity: 0.8;
    }

    .hero-title {
      margin-top: 4px;
      font-size: 21px;
      font-weight: 800;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .hero-stat {
      background: rgba(255,255,255,0.10);
      border-radius: 15px;
      padding: 13px;
    }

    .hero-stat-label {
      font-size: 11px;
      opacity: 0.8;
    }

    .hero-stat-value {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 800;
    }

    .hero-stat-unit {
      font-size: 11px;
      opacity: 0.8;
    }

    /* =========================================
       SECTION
    ========================================= */

    .section {
      margin-bottom: 18px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 17px;
      font-weight: 800;
      color: #16323a;
    }

    .section-subtitle {
      margin-top: -5px;
      margin-bottom: 10px;
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.6;
    }

    .section-link {
      color: #0f4c5c;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* =========================================
       CARD
    ========================================= */

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      box-shadow:
        0 4px 18px rgba(15, 76, 92, 0.06);
    }

    .empty {
      background: #fff;
      border-radius: 18px;
      padding: 22px 16px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
    }

    /* =========================================
       SAVINGS
    ========================================= */

    .savings-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .savings-card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      box-shadow:
        0 4px 18px rgba(15, 76, 92, 0.06);
    }

    .savings-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .savings-name {
      font-size: 15px;
      font-weight: 800;
      color: #16323a;
    }

    .savings-policy-no {
      margin-top: 4px;
      font-size: 11px;
      color: #9ca3af;
    }

    .savings-year {
      color: #0f4c5c;
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
    }

    .savings-caption {
      margin-top: 4px;
      font-size: 10px;
      color: #9ca3af;
    }

    .savings-amount {
      margin-top: 11px;
      font-size: 13px;
      color: #4b5563;
    }

    .savings-amount strong {
      color: #16323a;
      font-size: 15px;
    }

    .savings-term {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .term-badge {
      padding: 5px 8px;
      border-radius: 999px;
      background: #eef4f5;
      color: #45616a;
      font-size: 10px;
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 9px;
      margin-top: 13px;
      border-radius: 99px;
      background: #e7edef;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: 99px;
      background: #0f4c5c;
    }

    .savings-footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .mini-label {
      font-size: 11px;
      color: #9ca3af;
    }

    .mini-value {
      margin-top: 3px;
      font-size: 13px;
      font-weight: 700;
      color: #16323a;
    }

    /* =========================================
       COVERAGE
    ========================================= */

    .coverage-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .coverage-item {
      min-height: 112px;
      border-radius: 17px;
      padding: 14px;
      background: #fff;
      border: 1px solid #edf1f2;
      border-left: 4px solid var(
        --coverage-color,
        #0f4c5c
      );
      box-shadow:
        0 4px 15px rgba(15, 76, 92, 0.04);
    }

    .coverage-item.no-coverage {
      background: #f0f2f3;
      border-left-color: #c5cdd0;
      box-shadow: none;
    }

    .coverage-icon {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .coverage-name {
      font-size: 12px;
      color: #6b7280;
    }

    .coverage-value {
      margin-top: 4px;
      font-size: 17px;
      font-weight: 900;
      color: #16323a;
      line-height: 1.3;
    }

    .coverage-item.no-coverage .coverage-value {
      color: #9ca3af;
      font-size: 12px;
      font-weight: 700;
    }

    /* =========================================
       FAMILY
    ========================================= */

    .family-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 3px;
      scrollbar-width: none;
    }

    .family-list::-webkit-scrollbar {
      display: none;
    }

    .family-card {
      flex: 0 0 155px;
      background: #fff;
      border-radius: 17px;
      padding: 14px;
      box-shadow:
        0 4px 18px rgba(15, 76, 92, 0.06);
      cursor: pointer;
    }

    .family-avatar {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      background: #e8eef0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      font-size: 20px;
    }

    .family-name {
      font-size: 14px;
      font-weight: 800;
      color: #16323a;
    }

    .family-relation {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .family-coverage {
      margin-top: 10px;
      font-size: 12px;
      color: #4b5563;
    }

    /* =========================================
       EVENTS
    ========================================= */

    .event-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .event-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      box-shadow:
        0 4px 18px rgba(15, 76, 92, 0.05);
    }

    .event-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
      background: #9ca3af;
    }

    .event-indicator.high {
      background: #dc2626;
    }

    .event-indicator.normal {
      background: #d97706;
    }

    .event-indicator.info {
      background: #0f4c5c;
    }

    .event-content {
      min-width: 0;
      flex: 1;
    }

    .event-title {
      font-size: 13px;
      font-weight: 800;
      color: #16323a;
    }

    .event-description {
      margin-top: 4px;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.6;
    }

    .event-date {
      margin-top: 6px;
      color: #9ca3af;
      font-size: 11px;
    }

    /* =========================================
       INSIGHT
    ========================================= */

    .insight-card {
      background: #eaf3f5;
      border-radius: 18px;
      padding: 17px;
      border: 1px solid #dcebef;
    }

    .insight-title {
      font-size: 14px;
      font-weight: 800;
      color: #0f4c5c;
    }

    .insight-text {
      margin-top: 7px;
      font-size: 13px;
      line-height: 1.75;
      color: #35515a;
    }

    /* =========================================
       POLICY
    ========================================= */

    .policy-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .policy-card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      box-shadow:
        0 4px 18px rgba(15, 76, 92, 0.06);
    }

    .policy-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .policy-name {
      font-size: 15px;
      font-weight: 800;
      color: #16323a;
    }

    .policy-status {
      padding: 5px 9px;
      border-radius: 999px;
      background: #e9f7ef;
      color: #16834b;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .policy-no {
      margin-top: 4px;
      font-size: 11px;
      color: #9ca3af;
    }

    .policy-riders {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .rider-badge {
      border-radius: 999px;
      background: #f1f5f6;
      color: #4b5563;
      padding: 6px 8px;
      font-size: 10px;
      font-weight: 700;
    }

    .policy-footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      border-top: 1px solid #eef2f3;
      margin-top: 14px;
      padding-top: 12px;
    }

    /* =========================================
       FAMILY DETAIL
    ========================================= */

    .family-policy-title {
      margin-top: 16px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 800;
      color: #0f4c5c;
    }

    /* =====================================
       BOTTOM NAVIGATION
    ===================================== */
    
    .bottom-nav {
    
      position: fixed;
    
      left: 0;
      right: 0;
      bottom: 0;
    
      height: 68px;
    
      background: rgba(255,255,255,0.97);
    
      border-top: 1px solid #e5e7eb;
    
      display: grid;
    
      grid-template-columns: repeat(5, 1fr);
    
      align-items: stretch;
    
      z-index: 999;
    
      box-shadow:
        0 -4px 18px rgba(0,0,0,0.06);
    
    }

    .bottom-nav-item {

      appearance: none;
    
      border: 0;
    
      background: transparent;
    
      padding: 6px 2px 5px;
    
      margin: 0;
    
      min-width: 0;
    
      display: flex;
    
      flex-direction: column;
    
      align-items: center;
    
      justify-content: center;
    
      gap: 2px;
    
      color: #9ca3af;
    
      cursor: pointer;
    
    }
    
    
    .bottom-nav-item.active {
    
      color: #111827;
    
    }
    
    
    .bottom-nav-icon {
    
      font-size: 20px;
    
      line-height: 1;
    
    }
    
    
    .bottom-nav-label {
    
      font-size: 10px;
    
      font-weight: 600;
    
      line-height: 1.1;
    
      white-space: nowrap;
    
    }
    
    
    /* เพิ่มพื้นที่ด้านล่าง
       ไม่ให้ Content โดน Bottom Nav บัง */
    
    #pageContainer {
    
      padding-bottom: 84px;
    
    }

    .bottom-nav-inner {
      max-width: 640px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      min-height: 68px;
    }

    .nav-item {
      border: 0;
      background: transparent;
      color: #9ca3af;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 700;
    }

    .nav-item.active {
      color: #0f4c5c;
    }

    .nav-icon {
      font-size: 21px;
      line-height: 1;
    }

    @media (max-width: 380px) {

      .page {
        padding: 13px;
      }

      .coverage-grid {
        grid-template-columns: 1fr;
      }

      .hero-title {
        font-size: 19px;
      }

      .hero-stat-value {
        font-size: 18px;
      }

    }

    /* =========================================
       POLICY DETAIL
    ========================================= */
    
    .policy-detail-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .back-button {
      border: 0;
      background: #ffffff;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 20px;
      color: #0f4c5c;
      box-shadow: 0 4px 14px rgba(15, 76, 92, 0.06);
      flex-shrink: 0;
    }
    
    .detail-title {
      flex: 1;
      min-width: 0;
    }
    
    .detail-title-main {
      font-size: 18px;
      font-weight: 900;
      color: #16323a;
      line-height: 1.35;
    }
    
    .detail-title-sub {
      margin-top: 4px;
      color: #9ca3af;
      font-size: 11px;
    }
    
    .detail-section {
      background: #ffffff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow:
        0 4px 18px rgba(15, 76, 92, 0.05);
    }
    
    .detail-section-title {
      font-size: 14px;
      font-weight: 900;
      color: #16323a;
      margin-bottom: 12px;
    }
    
    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid #eef2f3;
    }
    
    .detail-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }
    
    .detail-label {
      color: #7b8790;
      font-size: 12px;
    }
    
    .detail-value {
      text-align: right;
      color: #16323a;
      font-size: 12px;
      font-weight: 800;
    }
    
    .detail-status {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e9f7ef;
      color: #16834b;
      font-size: 10px;
      font-weight: 900;
    }
    
    .coverage-detail-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .coverage-detail-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 12px;
      background: #f7f9fa;
      border-radius: 13px;
    }
    
    .coverage-detail-name {
      font-size: 12px;
      font-weight: 700;
      color: #465861;
    }
    
    .coverage-detail-value {
      font-size: 13px;
      font-weight: 900;
      color: #16323a;
      white-space: nowrap;
    }
    
    .waiting-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    
    .waiting-item {
      padding: 12px;
      border-radius: 14px;
      background: #f7f9fa;
    }
    
    .waiting-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    
    .waiting-name {
      font-size: 12px;
      font-weight: 800;
      color: #465861;
    }
    
    .waiting-status {
      font-size: 11px;
      font-weight: 900;
    }
    
    .waiting-status.done {
      color: #16834b;
    }
    
    .waiting-status.waiting {
      color: #d97706;
    }
    
    .waiting-progress {
      margin-top: 8px;
      width: 100%;
      height: 7px;
      border-radius: 99px;
      background: #e4eaec;
      overflow: hidden;
    }
    
    .waiting-progress-bar {
      height: 100%;
      border-radius: 99px;
      background: #d97706;
    }
    
    .deductible-box {
      background: #f7f9fa;
      border-radius: 15px;
      padding: 14px;
    }
    
    .deductible-main {
      font-size: 24px;
      font-weight: 900;
      color: #0f4c5c;
    }
    
    .deductible-caption {
      margin-top: 2px;
      color: #9ca3af;
      font-size: 11px;
    }
    
    .deductible-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    
    .deductible-stat {
      background: #ffffff;
      border-radius: 12px;
      padding: 10px;
    }
    
    .copayment-box {
      border-radius: 15px;
      padding: 14px;
      background: #f7f9fa;
    }
    
    .copayment-status-box {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 10px;
    }
    
    .copayment-status-safe {
      color: #16834b;
    }
    
    .copayment-status-warning {
      color: #d97706;
    }
    
    .copayment-status-danger {
      color: #dc2626;
    }
    
    .copayment-condition {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e5eaec;
    }
    
    .copayment-condition-title {
      font-size: 12px;

    document.addEventListener(
      'DOMContentLoaded',
      initAccount

    async function initAccount() {

      try {

        validateConfig();

        showLoading(
          'กำลังเริ่มต้นระบบ...'
        );


        if (
          typeof liff === 'undefined'
        ) {

          throw new Error(
            'ไม่พบ LINE LIFF SDK'
          );

        }


        await liff.init({
          liffId:
            CONFIG.LIFF_ID
        });


        /*
         * External Browser
         */
        if (
          !liff.isInClient() &&
          !liff.isLoggedIn()
        ) {

          showLoading(
            'กำลังเข้าสู่ระบบ LINE...'
          );

          liff.login();

          return;
        }


        /*
         * ID Token
         */
        const idToken =
          liff.getIDToken();


        if (!idToken) {

          throw new Error(
            'ไม่สามารถอ่าน LINE ID Token ได้'
          );

        }


        /*
         * Account API
         */
        showLoading(
          'กำลังโหลดข้อมูลของคุณ...'
        );


        const result =
          await requestAccount(
            idToken
          );


        if (
          !result ||
          !result.success
        ) {

          throw new Error(
            result?.error ||
            'ไม่สามารถโหลดข้อมูล Account ได้'
          );

        }


        /*
         * ยังไม่มีข้อมูล Customer
         */
        if (
          !result.registered
        ) {

          console.log(
            'LINE User ID:',
            result.lineUserId || ''
          );

          showWelcome();

          return;
        }


        accountData =
          result.account || {};


        showApp();

        renderPage(
          'home'
        );

        scrollToTop();


      } catch (error) {

        console.error(
          'initAccount error:',
          error
        );

        showError(
          error?.message ||
          'เกิดข้อผิดพลาด'
        );

      }

    }


    /* =========================================
       CONFIG VALIDATION
    ========================================= */

    function validateConfig() {

      if (
        !CONFIG.LIFF_ID ||
        CONFIG.LIFF_ID ===
          'YOUR_LIFF_ID'
      ) {

        throw new Error(
          'กรุณาใส่ LIFF ID ของ ANC Account'
        );

      }


      if (
        !CONFIG.API_URL ||
        !CONFIG.API_URL.includes(
          '/exec'
        )
      ) {

        throw new Error(
          'กรุณาตรวจสอบ API_URL ของ ANC Account API'
        );

      }

    }


    /* =========================================
       API
    ========================================= */

    async function requestAccount(
      idToken
    ) {

      const response =
        await fetch(
          CONFIG.API_URL,
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body:
              JSON.stringify({
                action:
                  'getAccount',

                idToken:
                  idToken
              })
          }
        );


      if (!response.ok) {

        throw new Error(
          `Account API HTTP ${response.status}`
        );

      }


      const text =
        await response.text();


      try {

        return JSON.parse(
          text
        );

      } catch (
        error
      ) {

        console.error(
          'Invalid API JSON:',
          text
        );

        throw new Error(
          'Account API ส่งข้อมูลกลับมาไม่ใช่ JSON'
        );

      }

    }

    function renderCoverageDetailPage() {

            coverage.coverageTypeId ||
            '';

            String(currentCoverageTypeId) !==
            String(coverageTypeId)
          ) {
    
            return;
    
          }
    
    
          const status =
            String(
              coverage.Status || 'ACTIVE'

    function renderWaitingPeriodItem(
      item
    ) {
    
      const waitingDays =
        Number(
          item.WaitingDays || 0
        );
    
    
      const remainingDays =
        Number(
          item.RemainingDays || 0
        );
    
    
      const completed =
        Boolean(
          item.Completed
        );
    
    
      let progress = 100;
    
    
      if (
        waitingDays > 0
      ) {
    
        progress =
          Math.min(
            Math.max(
              (
                waitingDays -
                remainingDays
              ) /
              waitingDays *
              100,
              0
            ),
            100
          );
    
      }
    
    
      return `
    
        <div class="waiting-item">
    
          <div class="waiting-head">
    
            <div class="waiting-name">
    
              ${escapeHtml(
                getWaitingTypeName(
                  item.WaitingType
                )
              )}
    
            </div>
    
    
            <div
              class="
                waiting-status
                ${
                  completed
                    ? 'done'
                    : 'waiting'
                }
              "
            >
    
              ${
                completed
                  ? '✅ ครบแล้ว'
                  : `เหลือ ${remainingDays} วัน`
              }
    
            </div>
    
          </div>
    
    
          ${
            !completed
              ? `
                <div class="waiting-progress">
    
                  <div
                    class="waiting-progress-bar"
                    style="
                      width:${progress}%
                    "
                  ></div>
    
                </div>
              `
              : ''
          }
    
        </div>
    
      `;
    
    }

    function renderPolicyWaitingSection(
      policy
    ) {
    
      /*
       * รวม Waiting Period จาก Rider ทุกตัว
       */
      const rawWaitingPeriods =
        (policy.riders || [])
          .flatMap(
            rider =>
              rider.waitingPeriods || []
          );
    
    
      /*
       * ป้องกันข้อมูลซ้ำ
       */
      const uniqueWaitingPeriods = [];
      const seen = new Set();
    
    
      rawWaitingPeriods.forEach(item => {
    
        /*
         * ถ้ามี WaitingPeriodID
         * ใช้ ID เป็นตัวหลัก
         */
        const waitingId =
          String(
            item.WaitingPeriodID || ''
          ).trim();
    
    
        /*
         * กรณีไม่มี ID
         * สร้าง Key จากข้อมูลสำคัญ
         */
        const fallbackKey =
          [
            item.WaitingType || '',
            item.WaitingDays || '',
            item.StartDate || '',
            item.EndDate || ''
          ].join('|');
    
    
        const key =
          waitingId
            ? `ID:${waitingId}`
            : `DATA:${fallbackKey}`;
    
    
        /*
         * เจอซ้ำ → ข้าม
         */
        if (seen.has(key)) {
          return;
        }
    
    
        seen.add(key);
    
        uniqueWaitingPeriods.push(item);
    
      });
    
    
      /*
       * ไม่มี Waiting Period
       */
      if (!uniqueWaitingPeriods.length) {
    
        return '';
    
      }
    
    
      /*
       * Render
       */
      return `
    
        <section class="detail-section">
    
          <div class="detail-section-title">
    
            ⏳ ระยะรอคอย
    
          </div>
    
    
          <div class="waiting-list">
    
            ${
              uniqueWaitingPeriods
                .map(
                  renderWaitingPeriodItem
                )
                .join('')
            }
    
          </div>
    
        </section>
    
      `;
    
    }

          .length;
    
    
      const lifeCoverage =
        getCoverageAmount(
          coverage,
          'LIFE'
        );
    
    
      const healthCoverage =
        getCoverageAmount(
          coverage,
          'HEALTH'
        );
    
    
      const savings =
        ownPolicies.filter(
          policy =>
            policy.savings
        );
    
    
      const events =
        accountData?.events || [];
    
    
      const family =
        accountData?.family || [];
    
    
      /*
       * =====================================
       * PRIORITY 1
       * มี Event ที่ต้องติดตาม
       * =====================================
       */
    
      if (events.length > 0) {
    
        const event =
          events[0];
    
    
        const title =
          event.Title ||
          'มีรายการที่ต้องติดตาม';
    
    
        let remainingText = '';
    
    
        if (
          event.RemainingDays !== null &&
          event.RemainingDays !== undefined &&
          event.RemainingDays !== ''
        ) {
    
          const days =
            Number(event.RemainingDays);
    
    
          if (days === 0) {
    
            remainingText =
              'วันนี้';
    
          } else if (days > 0) {
    
            remainingText =
              `อีก ${formatNumber(days)} วัน`;
    
          } else {
    
            remainingText =
              'เลยกำหนดแล้ว';
    
          }
    
        }
    
    
        return {
    
          type: 'event',
    
          title:
            'มีรายการที่ควรติดตาม',
    
          text:
            remainingText
              ? `${title} (${remainingText})`
              : title
    
        };
    
      }
    
    
      /*
       * =====================================
       * PRIORITY 2
       * มี Savings
       * =====================================
       */
    
      if (savings.length > 0) {
    
        const saving =
          savings[0];
    
    
        const progress =
          saving.ProgressPercent !== undefined
            ? Number(
                saving.ProgressPercent
              )
            : 0;
    
    
        const paymentTerm =
          saving.PaymentTermYears ||
          saving.MaturityTermYears ||
          '';
    
    
        return {
    
          type: 'savings',
    
          title:
            'แผนสะสมทรัพย์ของคุณ',
    
          text:
            paymentTerm
              ? `กำลังอยู่ในแผนชำระเบี้ย ${paymentTerm} ปี`
              : 'มีข้อมูลสะสมทรัพย์อยู่ในระบบ ANC'
    
        };
    
      }
    
    
      /*
       * =====================================
       * PRIORITY 3
       * มี Coverage
       * =====================================
       */
    
      if (
        activeCoverageCount > 0
      ) {
    
        let text =
          `ขณะนี้ ANC ดูแลความคุ้มครองให้คุณ ${activeCoverageCount} ด้าน`;
    
    
        if (
          lifeCoverage > 0 &&
          healthCoverage > 0
        ) {
    
          text +=
            ` มีทุนชีวิต ${formatNumber(lifeCoverage)} บาท และค่ารักษาพยาบาล ${formatNumber(healthCoverage)} บาท`;
    
        } else if (
          lifeCoverage > 0
        ) {
    
          text +=
            ` มีทุนชีวิต ${formatNumber(lifeCoverage)} บาท`;
    
        } else if (
          healthCoverage > 0
        ) {
    
          text +=
            ` มีค่ารักษาพยาบาล ${formatNumber(healthCoverage)} บาท`;
    
        }
    
    
        return {
    
          type: 'coverage',
    
          title:
            'ภาพรวมความคุ้มครองของคุณ',
    
          text:
            text
    
        };
    
      }
    
    
      /*
       * =====================================
       * PRIORITY 4
       * มี Family
       * =====================================
       */
    
      if (
        family.length > 0
      ) {
    
        return {
    
          type: 'family',
    
          title:
            'ครอบครัวของคุณ',
    
          text:
            `มีสมาชิกครอบครัว ${family.length} คนในระบบ ANC`
    
        };
    
      }
    
    
      /*
       * =====================================
       * DEFAULT
       * =====================================
       */
    
      return {
    
        type: 'empty',
    
        title:
          'ANC Life Planning',
    
        text:
          'ขณะนี้ยังมีข้อมูลไม่มากพอสำหรับสร้าง Insight เพิ่มเติม'
    
      };
    
    }


    /* =========================================
       BUILD OWN COVERAGE
    ========================================= */

    function buildOwnCoverageSummary() {

      const ownPolicies =
        getOwnPolicies();


      const ownPolicyIds =
        new Set(
          ownPolicies.map(
            policy =>
              String(
                policy.PolicyID
              )
          )
        );


      const sourceCoverage =
        (
          accountData?.coverageSummary ||
          {}
        );


      /*
       * coverageSummary จาก API
       * อาจรวมทุก Policy ของ Customer
       *
       * ดังนั้นสร้างใหม่จาก PolicyCoverage
       * ในแต่ละ Policy เพื่อให้ Summary
       * เป็นของตัวเองเท่านั้น
       */
      const result = {};


      /*
       * เริ่มจาก Coverage Master
       */
      ownPolicies
        .flatMap(
          policy =>
            policy.coverage || []
        )
        .forEach(
          item => {

            const typeId =
              String(
                item.CoverageTypeID ||
                ''
              );

            if (!typeId) {
              return;
            }


            if (!result[typeId]) {

              const master =
                sourceCoverage[typeId] ||
                {};

              result[typeId] = {

                CoverageTypeID:
                  typeId,

                CoverageName:
                  master.CoverageName ||
                  typeId,

                Unit:
                  item.CoverageUnit ||
                  master.Unit ||
                  'บาท',

                Icon:
                  master.Icon ||
                  '🛡️',

                ColorCode:
                  master.ColorCode ||
                  '#0F4C5C',

                DisplayOrder:
                  master.DisplayOrder ||
                  999,

                CoverageAmount:
                  0,

                HasCoverage:
                  false

              };

            }


            result[typeId]
              .CoverageAmount +=
              Number(
                item.CoverageAmount ||
                0
              );


            if (
              result[typeId]
                .CoverageAmount > 0
            ) {

              result[typeId]
                .HasCoverage = true;

            }

          }
        );


      /*
       * ให้ Category ที่ยังไม่มี
       * แสดงเป็นสีเทาด้วย
       */
      Object.keys(
        sourceCoverage
      )
      .forEach(
        typeId => {

          if (
            !result[typeId]
          ) {

            result[typeId] = {

              ...sourceCoverage[typeId],

              CoverageAmount:
                0,

              HasCoverage:
                false

            };

          }

        }
      );


      return result;

    }

    function formatDateDisplay(value) {

      if (!value) {
        return '-';
      }
    
    
      const date =
        new Date(value);
    
    
      if (isNaN(date.getTime())) {
        return String(value);
      }
    
    
      const day =
        String(
          date.getDate()
        ).padStart(2, '0');
    
    
      const month =
        String(
          date.getMonth() + 1
        ).padStart(2, '0');
    
    
      const year =
        date.getFullYear() + 543;
    
    
      return `${day}/${month}/${year}`;
    
    }

    function renderCoverageUsageSection(

                ${formatNumber(
                  usedAmount

              <span>
                คงเหลือ

                ${formatNumber(
                  remainingAmount

              <div

                style="

            </div>
    
          </div>
    
        `;
    
      }
    
    
      /*
       * ================================
       * COUNT
       * ================================
       */
    
      let countHtml = '';
    
    
      if (
        limitType === 'COUNT' ||
        limitType === 'AMOUNT_AND_COUNT'
      ) {
    
        const percentage =
          limitCount > 0
            ? Math.max(
                Math.min(
                  (
                    remainingCount /

                สิทธิ์ทั้งหมด

                ${formatNumber(

            <div class="usage-row usage-row-remaining">
    
              <span>
                คงเหลือ
              </span>
    
              <strong>

                  remainingCount

            <div class="usage-progress">

            </div>

        `;
    
      }
    
    
      /*
       * ================================

          <!-- Accordion Body -->

            ${countHtml}
    
            ${resetHtml}
    
          </div>
    
    
        </div>
    
      `;
    
    }

    /* =========================================

    function formatNumber(
      value
    ) {

      return Number(
        value || 0
      ).toLocaleString(
        'th-TH'
      );

    }

    function getRelationshipLabel(
      relationship
    ) {

      const labels = {

        SELF:
          'ตัวเอง',

        SPOUSE:
          'คู่สมรส',

        CHILD:
          'บุตร',

        FATHER:
          'บิดา',

        MOTHER:
          'มารดา',

        OTHER:
          'สมาชิกครอบครัว'

      };


      return (
        labels[
          String(
            relationship ||
            ''
          ).toUpperCase()
        ] ||
        'สมาชิกครอบครัว'
      );

    }


    function escapeHtml(
      value
    ) {

      return String(
        value ?? ''
      )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );

    }
