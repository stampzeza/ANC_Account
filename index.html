<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0F4C5C">
  <title>ANC Life Planning</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:#f5f7f8;color:#1f2933;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}html{scroll-behavior:auto}body{min-height:100vh}button{font:inherit;cursor:pointer}.hidden{display:none!important}.app{min-height:100vh;padding-bottom:88px}.page{width:100%;max-width:640px;margin:0 auto;padding:16px}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.box{width:100%;max-width:400px;background:#fff;border-radius:22px;padding:28px 22px;text-align:center;box-shadow:0 8px 30px rgba(15,76,92,.08)}.logo{width:72px;height:72px;margin:0 auto 16px;border-radius:20px;background:#0f4c5c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}.screen-title{font-size:21px;font-weight:800;color:#0f4c5c}.screen-text{margin-top:10px;color:#6b7280;font-size:14px;line-height:1.7;white-space:pre-line}.spinner{width:30px;height:30px;margin:20px auto 0;border:3px solid #d9e2e6;border-top-color:#0f4c5c;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800}.btn-primary{margin-top:18px;width:100%;background:#0f4c5c;color:#fff}.header{display:flex;align-items:center;gap:14px;margin-bottom:18px}.avatar,.avatar-ph{width:58px;height:58px;border-radius:50%;flex-shrink:0}.avatar{object-fit:cover;background:#dfe8eb}.avatar-ph{background:#dfe8eb;display:flex;align-items:center;justify-content:center;font-size:24px}.header-text{min-width:0;flex:1}.greeting{font-size:13px;color:#6b7280}.name{font-size:20px;font-weight:800;color:#0f4c5c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:11px;color:#9ca3af;margin-top:3px}.section{margin-bottom:18px}.section-title{font-size:17px;font-weight:800;margin-bottom:10px;color:#16323a;display:flex;justify-content:space-between;align-items:center}.link{font-size:12px;color:#0f4c5c}.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(15,76,92,.06)}.empty{background:#fff;border-radius:18px;padding:22px 16px;text-align:center;color:#9ca3af;font-size:13px}.savings-list,.policy-list,.event-list{display:flex;flex-direction:column;gap:10px}.savings-card,.policy-card,.event-card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(15,76,92,.06)}.row{display:flex;justify-content:space-between;gap:12px}.strong{font-weight:800}.muted{font-size:12px;color:#6b7280}.progress{height:8px;background:#e7edef;border-radius:999px;overflow:hidden;margin-top:12px}.bar{height:100%;background:#0f4c5c;border-radius:999px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.coverage{min-height:100px;border-radius:16px;padding:14px;background:#fff;border:1px solid #edf1f2;border-left:4px solid var(--c,#0f4c5c)}.coverage.off{background:#f2f4f5;border-left-color:#cfd6d8}.coverage-icon{font-size:22px}.coverage-name{font-size:12px;color:#6b7280;margin-top:7px}.coverage-value{font-size:17px;font-weight:800;margin-top:4px}.coverage.off .coverage-value{font-size:12px;color:#9ca3af}.family-list{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}.family-list::-webkit-scrollbar{display:none}.family{flex:0 0 150px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(15,76,92,.06)}.family-avatar{width:42px;height:42px;border-radius:50%;background:#e8eef0;display:flex;align-items:center;justify-content:center;margin-bottom:10px}.family-name{font-size:14px;font-weight:800}.family-rel{font-size:11px;color:#9ca3af;margin-top:2px}.event{display:flex;gap:12px;align-items:flex-start}.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;background:#0f4c5c}.dot.high{background:#dc2626}.dot.normal{background:#d97706}.event-body{flex:1}.event-title{font-size:13px;font-weight:800}.event-desc{margin-top:4px;color:#6b7280;font-size:12px;line-height:1.6}.event-date{margin-top:6px;color:#9ca3af;font-size:11px}.insight{background:#eaf3f5;border-radius:18px;padding:16px}.insight-title{font-size:14px;font-weight:800;color:#0f4c5c}.insight-text{margin-top:7px;font-size:13px;line-height:1.7;color:#35515a}.riders{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.badge{background:#f1f5f6;color:#4b5563;border-radius:999px;padding:6px 8px;font-size:10px;font-weight:700}.footer{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid #eef2f3;margin-top:14px;padding-top:12px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:100;background:rgba(255,255,255,.96);border-top:1px solid #e6ecee;backdrop-filter:blur(10px)}.nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);min-height:68px}.nav button{border:0;background:transparent;color:#9ca3af;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700}.nav button.active{color:#0f4c5c}.nav-icon{font-size:21px}.status{padding:5px 9px;border-radius:999px;background:#e9f7ef;color:#16834b;font-size:10px;font-weight:800;white-space:nowrap}@media(max-width:380px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="loading" class="screen"><div class="box"><div class="logo">ANC</div><div class="screen-title">ANC Life Planning</div><div id="loadingText" class="screen-text">กำลังเชื่อมต่อบัญชีของคุณ...</div><div class="spinner"></div></div></div>
  <div id="error" class="screen hidden"><div class="box"><div style="font-size:42px">⚠️</div><div class="screen-title">ไม่สามารถโหลดข้อมูลได้</div><div id="errorText" class="screen-text"></div><button class="btn btn-primary" onclick="location.reload()">ลองอีกครั้ง</button></div></div>
  <div id="welcome" class="screen hidden"><div class="box"><div style="font-size:48px">👋</div><div class="screen-title">ยินดีต้อนรับสู่ ANC</div><div class="screen-text">ยังไม่พบข้อมูล Account ของคุณ\n\nระบบแสดงข้อมูลเฉพาะความคุ้มครองที่ ANC Life Planning ดูแล</div><button class="btn btn-primary" onclick="handleRegister()">เริ่มต้นใช้งาน</button></div></div>
  <div id="app" class="app hidden"><main id="page" class="page"></main></div>
  <nav id="bottom" class="bottom hidden"><div class="nav"><button class="active" data-page="home" onclick="navigateTo('home')"><span class="nav-icon">🏠</span><span>ภาพรวม</span></button><button data-page="policies" onclick="navigateTo('policies')"><span class="nav-icon">🛡️</span><span>กรมธรรม์</span></button><button data-page="family" onclick="navigateTo('family')"><span class="nav-icon">👨‍👩‍👧‍👦</span><span>ครอบครัว</span></button><button data-page="account" onclick="navigateTo('account')"><span class="nav-icon">👤</span><span>บัญชี</span></button></div></nav>
  <script>
    const CONFIG={LIFF_ID:'YOUR_LIFF_ID',API_URL:'https://script.google.com/macros/s/AKfycbxiaKpavAocuYtKoB_YYke9I_J1r9uTkEm/exec'};
    let accountData=null;

    document.addEventListener('DOMContentLoaded',initAccount);

    async function initAccount(){
      try{
        if(!CONFIG.LIFF_ID||CONFIG.LIFF_ID==='YOUR_LIFF_ID') throw new Error('กรุณาใส่ LIFF ID ของ ANC Account ใน index.html');
        setLoading('กำลังเริ่มต้นระบบ...');
        await liff.init({liffId:CONFIG.LIFF_ID});
        if(!liff.isInClient()&&!liff.isLoggedIn()){setLoading('กำลังเข้าสู่ระบบ LINE...');liff.login();return;}
        const idToken=liff.getIDToken();
        if(!idToken) throw new Error('ไม่สามารถอ่าน LINE ID Token ได้');
        setLoading('กำลังโหลดข้อมูลของคุณ...');
        const result=await requestAccount(idToken);
        if(!result||!result.success) throw new Error(result?.error||'ไม่สามารถโหลดข้อมูล Account ได้');
        if(!result.registered){showWelcome();console.log('LINE User ID:',result.lineUserId||'');return;}
        accountData=result.account||{};
        showApp();
        renderPage('home');
      }catch(err){console.error(err);showError(err?.message||'เกิดข้อผิดพลาด');}
    }

    async function requestAccount(idToken){
      const response=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getAccount',idToken})});
      if(!response.ok) throw new Error(`Account API HTTP ${response.status}`);
      const text=await response.text();
      try{return JSON.parse(text);}catch(e){console.error(text);throw new Error('Account API ส่งข้อมูลกลับมาไม่ใช่ JSON');}
    }

    function setLoading(text){document.getElementById('loadingText').textContent=text;document.getElementById('loading').classList.remove('hidden');document.getElementById('error').classList.add('hidden');document.getElementById('welcome').classList.add('hidden');document.getElementById('app').classList.add('hidden');document.getElementById('bottom').classList.add('hidden');}
    function showError(text){document.getElementById('loading').classList.add('hidden');document.getElementById('error').classList.remove('hidden');document.getElementById('errorText').textContent=text;document.getElementById('welcome').classList.add('hidden');document.getElementById('app').classList.add('hidden');document.getElementById('bottom').classList.add('hidden');}
    function showWelcome(){document.getElementById('loading').classList.add('hidden');document.getElementById('error').classList.add('hidden');document.getElementById('welcome').classList.remove('hidden');document.getElementById('app').classList.add('hidden');document.getElementById('bottom').classList.add('hidden');}
    function showApp(){document.getElementById('loading').classList.add('hidden');document.getElementById('error').classList.add('hidden');document.getElementById('welcome').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('bottom').classList.remove('hidden');}

    function navigateTo(page){renderPage(page);scrollToTop();}
    function renderPage(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const el=document.getElementById('page');if(page==='home')el.innerHTML=renderHome();else if(page==='policies')el.innerHTML=renderPolicies();else if(page==='family')el.innerHTML=renderFamily();else el.innerHTML=renderAccount();scrollToTop();}
    function scrollToTop(){window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;}

    function renderHome(){
      const c=accountData?.customer||{},cov=Object.values(accountData?.coverageSummary||{}),family=accountData?.family||[],events=accountData?.events||[];
      const savings=(accountData?.policies||[]).filter(p=>p.savings);
      return `<div class="header">${c.ProfileImageURL?`<img class="avatar" src="${escapeHtml(c.ProfileImageURL)}" alt="">`:`<div class="avatar-ph">👤</div>`}<div class="header-text"><div class="greeting">สวัสดีครับ 👋</div><div class="name">${escapeHtml(c.DisplayName||c.FirstName||'-')}</div><div class="sub">ข้อมูลความคุ้มครองที่ ANC Life Planning ดูแล</div></div></div>
      <section class="section"><div class="section-title">💰 เงินก้อนจากสะสมทรัพย์</div>${savings.length?`<div class="savings-list">${savings.map(renderSavings).join('')}</div>`:`<div class="empty">ยังไม่มีข้อมูลสะสมทรัพย์ในระบบ ANC</div>`}</section>
      <section class="section"><div class="section-title">🛡️ ความคุ้มครองที่ ANC ดูแล</div>${cov.length?`<div class="grid">${cov.map(renderCoverage).join('')}</div>`:`<div class="empty">ยังไม่มีข้อมูลความคุ้มครองในระบบ ANC</div>`}</section>
      <section class="section"><div class="section-title">👨‍👩‍👧‍👦 ครอบครัวของฉัน${family.length?`<span class="link" onclick="navigateTo('family')">ดูทั้งหมด</span>`:''}</div>${family.length?`<div class="family-list">${family.map(renderFamilyPreview).join('')}</div>`:`<div class="empty">ยังไม่มีสมาชิกครอบครัวในระบบ ANC</div>`}</section>
      <section class="section"><div class="section-title">🔔 สิ่งที่ต้องรู้</div>${events.length?`<div class="event-list">${events.slice(0,3).map(renderEvent).join('')}</div>`:`<div class="empty">ตอนนี้ยังไม่มีรายการที่ต้องติดตาม</div>`}</section>
      <section class="section"><div class="section-title">💡 ANC Insight</div><div class="insight"><div class="insight-title">ภาพรวมความคุ้มครองของคุณ</div><div class="insight-text">ระบบแสดงข้อมูลเฉพาะความคุ้มครองที่ ANC Life Planning ดูแล${cov.length?` ขณะนี้มีข้อมูล ${cov.filter(x=>x.HasCoverage).length} ด้านความคุ้มครอง`:''}</div></div></section>`;
    }

    function renderSavings(policy){const s=policy.savings||{},cy=Number(s.CurrentPaymentYear||0),ty=Number(s.PaymentTermYears||0),pp=Number(s.ProgressPercent||0);return `<div class="savings-card"><div class="row"><div><div class="strong">${escapeHtml(policy.PlanName||'-')}</div><div class="muted" style="margin-top:6px">ทุนครบสัญญา <b>${formatNumber(s.MaturityAmount)}</b> บาท</div></div><div class="strong" style="color:#0f4c5c">${String(cy).padStart(2,'0')} / ${String(ty).padStart(2,'0')}</div></div><div class="progress"><div class="bar" style="width:${Math.min(Math.max(pp,0),100)}%"></div></div><div class="footer"><div><div class="mini-label">จ่ายเบี้ยหมด</div><div class="mini-value">${formatDate(s.PremiumEndDate)}</div></div><div><div class="mini-label">ครบสัญญา</div><div class="mini-value">${formatDate(s.MaturityDate)}</div></div></div></div>`;}
    function renderCoverage(x){const has=!!x.HasCoverage;return `<div class="coverage ${has?'':'off'}" style="--c:${escapeHtml(x.ColorCode||'#0f4c5c')}"><div class="coverage-icon">${escapeHtml(x.Icon||'🛡️')}</div><div class="coverage-name">${escapeHtml(x.CoverageName||'-')}</div><div class="coverage-value">${has?`${formatNumber(x.CoverageAmount)} ${escapeHtml(x.Unit||'')}`:'ยังไม่มีข้อมูลใน ANC'}</div></div>`;}
    function renderFamilyPreview(m){return `<div class="family"><div class="family-avatar">👤</div><div class="family-name">${escapeHtml(m.DisplayName||m.FirstName||'-')}</div><div class="family-rel">${escapeHtml(relLabel(m.Relationship))}</div><div class="family-coverage">ดูข้อมูลความคุ้มครอง</div></div>`;}
    function renderEvent(e){const p=String(e.Priority||'INFO').toLowerCase(),r=Number(e.RemainingDays||0);return `<div class="event-card"><div class="event"><div class="dot ${p}"></div><div class="event-body"><div class="event-title">${escapeHtml(e.Title||'-')}</div><div class="event-desc">${escapeHtml(e.Description||'')}</div><div class="event-date">${escapeHtml(formatDate(e.EventDate))}${r>0?` · อีก ${r} วัน`:' · วันนี้'}</div></div></div></div>`;}

    function renderPolicies(){const ps=accountData?.policies||[];return `<div class="section-title">🛡️ กรมธรรม์ที่ ANC ดูแล</div>${ps.length?`<div class="policy-list">${ps.map(p=>{const rs=p.riders||[];return `<div class="policy-card"><div class="row"><div><div class="strong">${escapeHtml(p.PlanName||'-')}</div><div class="muted">กรมธรรม์ ${escapeHtml(p.PolicyNo||'-')}</div></div><div class="status">${escapeHtml(p.PolicyStatus||'ACTIVE')}</div></div>${rs.length?`<div class="riders">${rs.map(r=>`<span class="badge">${escapeHtml(r.RiderName||r.RiderID||'-')}</span>`).join('')}</div>`:''}<div class="footer"><div><div class="mini-label">เริ่มคุ้มครอง</div><div class="mini-value">${formatDate(p.EffectiveDate)}</div></div><div><div class="mini-label">จ่ายเบี้ยครั้งต่อไป</div><div class="mini-value">${formatDate(p.NextPaymentDate)}</div></div></div></div>`}).join('')}</div>`:`<div class="empty">ยังไม่มีข้อมูลกรมธรรม์</div>`}`;}
    function renderFamily(){const fs=accountData?.family||[];return `<div class="section-title">👨‍👩‍👧‍👦 ครอบครัวของฉัน</div>${fs.length?`<div class="policy-list">${fs.map(m=>`<div class="card"><div class="row"><div><div class="strong">${escapeHtml(m.DisplayName||m.FirstName||'-')}</div><div class="muted">${escapeHtml(relLabel(m.Relationship))}</div></div><div class="status">ACTIVE</div></div><div class="footer"><div><div class="mini-label">วันเกิด</div><div class="mini-value">${formatDate(m.BirthDate)}</div></div></div></div>`).join('')}</div>`:`<div class="empty">ยังไม่มีข้อมูลสมาชิกครอบครัว</div>`}`;}
    function renderAccount(){const c=accountData?.customer||{};return `<div class="section-title">👤 บัญชีของฉัน</div><div class="card"><div class="strong">${escapeHtml(c.DisplayName||((c.FirstName||'')+' '+(c.LastName||'')).trim()||'-')}</div><div class="muted" style="margin-top:8px">LINE Account เชื่อมต่อแล้ว</div><div class="footer"><div><div class="mini-label">เบอร์โทร</div><div class="mini-value">${escapeHtml(c.Phone||'-')}</div></div><div><div class="mini-label">Email</div><div class="mini-value">${escapeHtml(c.Email||'-')}</div></div></div></div>`;}

    function handleRegister(){alert('ขั้นตอนสมัคร Account จะเชื่อมต่อใน Phase ถัดไปครับ');}
    function formatNumber(v){return Number(v||0).toLocaleString('th-TH');}
    function formatDate(v){if(!v)return '-';const p=String(v).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(v);}
    function relLabel(v){return ({SELF:'ตัวเอง',SPOUSE:'คู่สมรส',CHILD:'บุตร',FATHER:'บิดา',MOTHER:'มารดา',OTHER:'สมาชิกครอบครัว'})[String(v||'').toUpperCase()]||'สมาชิกครอบครัว';}
    function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
  </script>
</body>
</html>
