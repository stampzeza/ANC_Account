<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

  <title>ANC Life Planning</title>

  <!-- LINE LIFF SDK -->

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: auto;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f5f7f8;
      color: #1f2933;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 92px;
    }

    .page {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
    }

    /* =========================================
       LOADING
    ========================================= */

    .loading-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .loading-box {
      width: 100%;
      max-width: 320px;
      text-align: center;
    }

    .loading-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: #0f4c5c;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .loading-title {
      font-size: 21px;
      font-weight: 800;
      color: #16323a;
      margin-bottom: 8px;
    }

    .loading-text {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
    }

    .spinner {
      width: 30px;
      height: 30px;
      margin: 20px auto 0;
      border: 3px solid #d9e2e6;
      border-top-color: #0f4c5c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================
       ERROR / WELCOME
    ========================================= */

    .error-screen,
    .welcome {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .error-box,
    .welcome-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 22px;
      padding: 30px 22px;
      text-align: center;
      box-shadow:
        0 8px 30px rgba(15, 76, 92, 0.08);
    }

    .error-icon,
    .welcome-icon {
      font-size: 44px;
      margin-bottom: 12px;
    }

    .error-title,
    .welcome-title {
      font-size: 21px;
      font-weight: 800;
      color: #16323a;
      margin-bottom: 10px;
    }

    .welcome-title {
      color: #0f4c5c;
    }

    .error-message,
    .welcome-text {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-line;
      word-break: break-word;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 800;
    }

    .btn-primary {
      margin-top: 18px;
      width: 100%;
      background: #0f4c5c;
      color: #fff;
    }

    /* =========================================
       HEADER
    ========================================= */

    .account-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .profile-image,
    .profile-placeholder {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .profile-image {
      object-fit: cover;
      background: #dfe8eb;
    }

    .profile-placeholder {
      background: #dfe8eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .account-greeting {
      flex: 1;
      min-width: 0;
    }

    .greeting {
      font-size: 13px;
      color: #6b7280;
    }

    .display-name {
      font-size: 20px;
      font-weight: 800;
      color: #0f4c5c;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .updated-text {
      margin-top: 3px;
      font-size: 11px;
      color: #9ca3af;
    }

    /* =========================================
       HERO
    ========================================= */

    .hero-card {
      background:
        linear-gradient(
          135deg,
          #0f4c5c,
          #17697b
        );
      color: #fff;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow:
        0 10px 28px rgba(15, 76, 92, 0.18);
    }

    .hero-label {
      font-size: 12px;
      opacity: 0.8;
    }

    .hero-title {
      margin-top: 4px;
      font-size: 21px;
      font-weight: 800;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .hero-stat {
      background: rgba(255,255,255,0.10);
      border-radius: 15px;
      padding: 13px;
    }

    .hero-stat-label {
      font-size: 11px;
      opacity: 0.8;
    }

    .hero-stat-value {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 800;
    }

    .hero-stat-unit {
      font-size: 11px;
      opacity: 0.8;
    }

    /* =========================================
       SECTION
    ========================================= */

    .section {
      margin-bottom: 18px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 17px;
      font-weight: 800;
      color: #16323a;
    }

    .section-subtitle {
      margin-top: -5px;
      margin-bottom: 10px;
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.6;
    }

    .section-link {
      color: #0f4c5c;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* =========================================
       CARD
    ========================================= */

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      box-shadow:
        0 4px 18px rgba(15, 76, 92, 0.06);
    }

    .empty {
      background: #fff;
      border-radius: 18px;
      padding: 22px 16px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
    }

    /* =========================================
       SAVINGS
    ========================================= */

    .savings-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .savings-card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      box-shadow:
        0 4px 18px rgba(15, 76, 92, 0.06);
    }

    .savings-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .savings-name {
      font-size: 15px;
      font-weight: 800;
      color: #16323a;
    }

    .savings-policy-no {
      margin-top: 4px;
      font-size: 11px;
      color: #9ca3af;
    }

    .savings-year {
      color: #0f4c5c;
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
    }

    .savings-caption {
      margin-top: 4px;
      font-size: 10px;
      color: #9ca3af;
    }

    .savings-amount {
      margin-top: 11px;
      font-size: 13px;
      color: #4b5563;
    }

    .savings-amount strong {
      color: #16323a;
      font-size: 15px;
    }

    .savings-term {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .term-badge {
      padding: 5px 8px;
      border-radius: 999px;
      background: #eef4f5;
      color: #45616a;
      font-size: 10px;
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 9px;
      margin-top: 13px;
      border-radius: 99px;
      background: #e7edef;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: 99px;
      background: #0f4c5c;
    }

    .savings-footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .mini-label {
      font-size: 11px;
      color: #9ca3af;
    }

    .mini-value {
      margin-top: 3px;
      font-size: 13px;
      font-weight: 700;
      color: #16323a;
    }

    /* =========================================
       COVERAGE
    ========================================= */

    .coverage-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .coverage-item {
      min-height: 112px;
      border-radius: 17px;
      padding: 14px;
      background: #fff;
      border: 1px solid #edf1f2;
      border-left: 4px solid var(
        --coverage-color,
        #0f4c5c
      );
      box-shadow:
        0 4px 15px rgba(15, 76, 92, 0.04);
    }

    .coverage-item.no-coverage {
      background: #f0f2f3;
      border-left-color: #c5cdd0;
      box-shadow: none;
    }

    .coverage-icon {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .coverage-name {
      font-size: 12px;
      color: #6b7280;
    }

    .coverage-value {
      margin-top: 4px;
      font-size: 17px;
      font-weight: 900;
      color: #16323a;
      line-height: 1.3;
    }

    .coverage-item.no-coverage .coverage-value {
      color: #9ca3af;
      font-size: 12px;
      font-weight: 700;
    }

    /* =========================================
       FAMILY
    ========================================= */

    .family-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 3px;
      scrollbar-width: none;
    }

    .family-list::-webkit-scrollbar {
      display: none;
    }

    .family-card {
      flex: 0 0 155px;
      background: #fff;
      border-radius: 17px;
      padding: 14px;
      box-shadow:
        0 4px 18px rgba(15, 76, 92, 0.06);
      cursor: pointer;
    }

    .family-avatar {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      background: #e8eef0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      font-size: 20px;
    }

    .family-name {
      font-size: 14px;
      font-weight: 800;
      color: #16323a;
    }

    .family-relation {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .family-coverage {
      margin-top: 10px;
      font-size: 12px;
      color: #4b5563;
    }

    /* =========================================
       EVENTS
    ========================================= */

    .event-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .event-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      box-shadow:
        0 4px 18px rgba(15, 76, 92, 0.05);
    }

    .event-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
      background: #9ca3af;
    }

    .event-indicator.high {
      background: #dc2626;
    }

    .event-indicator.normal {
      background: #d97706;
    }

    .event-indicator.info {
      background: #0f4c5c;
    }

    .event-content {
      min-width: 0;
      flex: 1;
    }

    .event-title {
      font-size: 13px;
      font-weight: 800;
      color: #16323a;
    }

    .event-description {
      margin-top: 4px;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.6;
    }

    .event-date {
      margin-top: 6px;
      color: #9ca3af;
      font-size: 11px;
    }

    /* =========================================
       INSIGHT
    ========================================= */

    .insight-card {
      background: #eaf3f5;
      border-radius: 18px;
      padding: 17px;
      border: 1px solid #dcebef;
    }

    .insight-title {
      font-size: 14px;
      font-weight: 800;
      color: #0f4c5c;
    }

    .insight-text {
      margin-top: 7px;
      font-size: 13px;
      line-height: 1.75;
      color: #35515a;
    }

    /* =========================================
       POLICY
    ========================================= */

    .policy-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .policy-card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      box-shadow:
        0 4px 18px rgba(15, 76, 92, 0.06);
    }

    .policy-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .policy-name {
      font-size: 15px;
      font-weight: 800;
      color: #16323a;
    }

    .policy-status {
      padding: 5px 9px;
      border-radius: 999px;
      background: #e9f7ef;
      color: #16834b;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .policy-no {
      margin-top: 4px;
      font-size: 11px;
      color: #9ca3af;
    }

    .policy-riders {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .rider-badge {
      border-radius: 999px;
      background: #f1f5f6;
      color: #4b5563;
      padding: 6px 8px;
      font-size: 10px;
      font-weight: 700;
    }

    .policy-footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      border-top: 1px solid #eef2f3;
      margin-top: 14px;
      padding-top: 12px;
    }

    /* =========================================
       FAMILY DETAIL
    ========================================= */

    .family-policy-title {
      margin-top: 16px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 800;
      color: #0f4c5c;
    }

    /* =========================================
       BOTTOM NAV
    ========================================= */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      background: rgba(255,255,255,0.97);
      border-top: 1px solid #e6ecee;
      backdrop-filter: blur(10px);
    }

    .bottom-nav-inner {
      max-width: 640px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      min-height: 68px;
    }

    .nav-item {
      border: 0;
      background: transparent;
      color: #9ca3af;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 700;
    }

    .nav-item.active {
      color: #0f4c5c;
    }

    .nav-icon {
      font-size: 21px;
      line-height: 1;
    }

    @media (max-width: 380px) {

      .page {
        padding: 13px;
      }

      .coverage-grid {
        grid-template-columns: 1fr;
      }

      .hero-title {
        font-size: 19px;
      }

      .hero-stat-value {
        font-size: 18px;
      }

    }

  </style>

</head>

  <script>

    /* =========================================
       CONFIG
    ========================================= */

    const CONFIG = {

      LIFF_ID:
        '2011442900-xcPpvfIE',

      API_URL:
        'https://script.google.com/macros/s/AKfycbxiaKpavAocuYtKoB_YYke9I_J1r9uTkEmOmcdxb9byJI_15Elzh8qovqMGlbhqqzEq/exec'

    };


    /* =========================================
       STATE
    ========================================= */

    let accountData = null;

    let currentPage = 'home';


    /* =========================================
       INIT
    ========================================= */

    document.addEventListener(
      'DOMContentLoaded',
      initAccount
    );


    async function initAccount() {

      try {

        validateConfig();

        showLoading(
          'กำลังเริ่มต้นระบบ...'
        );


        if (
          typeof liff === 'undefined'
        ) {

          throw new Error(
            'ไม่พบ LINE LIFF SDK'
          );

        }


        await liff.init({
          liffId:
            CONFIG.LIFF_ID
        });


        /*
         * External Browser
         */
        if (
          !liff.isInClient() &&
          !liff.isLoggedIn()
        ) {

          showLoading(
            'กำลังเข้าสู่ระบบ LINE...'
          );

          liff.login();

          return;
        }


        /*
         * ID Token
         */
        const idToken =
          liff.getIDToken();


        if (!idToken) {

          throw new Error(
            'ไม่สามารถอ่าน LINE ID Token ได้'
          );

        }


        /*
         * Account API
         */
        showLoading(
          'กำลังโหลดข้อมูลของคุณ...'
        );


        const result =
          await requestAccount(
            idToken
          );


        if (
          !result ||
          !result.success
        ) {

          throw new Error(
            result?.error ||
            'ไม่สามารถโหลดข้อมูล Account ได้'
          );

        }


        /*
         * ยังไม่มีข้อมูล Customer
         */
        if (
          !result.registered
        ) {

          console.log(
            'LINE User ID:',
            result.lineUserId || ''
          );

          showWelcome();

          return;
        }


        accountData =
          result.account || {};


        showApp();

        renderPage(
          'home'
        );

        scrollToTop();


      } catch (error) {

        console.error(
          'initAccount error:',
          error
        );

        showError(
          error?.message ||
          'เกิดข้อผิดพลาด'
        );

      }

    }


    /* =========================================
       CONFIG VALIDATION
    ========================================= */

    function validateConfig() {

      if (
        !CONFIG.LIFF_ID ||
        CONFIG.LIFF_ID ===
          'YOUR_LIFF_ID'
      ) {

        throw new Error(
          'กรุณาใส่ LIFF ID ของ ANC Account'
        );

      }


      if (
        !CONFIG.API_URL ||
        !CONFIG.API_URL.includes(
          '/exec'
        )
      ) {

        throw new Error(
          'กรุณาตรวจสอบ API_URL ของ ANC Account API'
        );

      }

    }


    /* =========================================
       API
    ========================================= */

    async function requestAccount(
      idToken
    ) {

      const response =
        await fetch(
          CONFIG.API_URL,
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body:
              JSON.stringify({
                action:
                  'getAccount',

                idToken:
                  idToken
              })
          }
        );


      if (!response.ok) {

        throw new Error(
          `Account API HTTP ${response.status}`
        );

      }


      const text =
        await response.text();


      try {

        return JSON.parse(
          text
        );

      } catch (
        error
      ) {

        console.error(
          'Invalid API JSON:',
          text
        );

        throw new Error(
          'Account API ส่งข้อมูลกลับมาไม่ใช่ JSON'
        );

      }

    }

      page

      document
        .querySelectorAll(

        .forEach(
          button => {

            button.classList.toggle(
              'active',
              button.dataset.page === page

      page

          break;

    /* =========================================
       BUILD OWN COVERAGE
    ========================================= */

    function buildOwnCoverageSummary() {

      const ownPolicies =
        getOwnPolicies();


      const ownPolicyIds =
        new Set(
          ownPolicies.map(
            policy =>
              String(
                policy.PolicyID
              )
          )
        );


      const sourceCoverage =
        (
          accountData?.coverageSummary ||
          {}
        );


      /*
       * coverageSummary จาก API
       * อาจรวมทุก Policy ของ Customer
       *
       * ดังนั้นสร้างใหม่จาก PolicyCoverage
       * ในแต่ละ Policy เพื่อให้ Summary
       * เป็นของตัวเองเท่านั้น
       */
      const result = {};


      /*
       * เริ่มจาก Coverage Master
       */
      ownPolicies
        .flatMap(
          policy =>
            policy.coverage || []
        )
        .forEach(
          item => {

            const typeId =
              String(
                item.CoverageTypeID ||
                ''
              );

            if (!typeId) {
              return;
            }


            if (!result[typeId]) {

              const master =
                sourceCoverage[typeId] ||
                {};

              result[typeId] = {

                CoverageTypeID:
                  typeId,

                CoverageName:
                  master.CoverageName ||
                  typeId,

                Unit:
                  item.CoverageUnit ||
                  master.Unit ||
                  'บาท',

                Icon:
                  master.Icon ||
                  '🛡️',

                ColorCode:
                  master.ColorCode ||
                  '#0F4C5C',

                DisplayOrder:
                  master.DisplayOrder ||
                  999,

                CoverageAmount:
                  0,

                HasCoverage:
                  false

              };

            }


            result[typeId]
              .CoverageAmount +=
              Number(
                item.CoverageAmount ||
                0
              );


            if (
              result[typeId]
                .CoverageAmount > 0
            ) {

              result[typeId]
                .HasCoverage = true;

            }

          }
        );


      /*
       * ให้ Category ที่ยังไม่มี
       * แสดงเป็นสีเทาด้วย
       */
      Object.keys(
        sourceCoverage
      )
      .forEach(
        typeId => {

          if (
            !result[typeId]
          ) {

            result[typeId] = {

              ...sourceCoverage[typeId],

              CoverageAmount:
                0,

              HasCoverage:
                false

            };

          }

        }
      );


      return result;

    }

              <div class="empty">
                ยังไม่มีข้อมูลสมาชิกครอบครัว
              </div>
            `
        }

      `;

    }


    function renderFamilyPreview(
      member
    ) {

      const policies =
        getFamilyPolicies(
          member.FamilyMemberID
        );


      return `

        <div
          class="family-card"
          onclick="
            showFamilyMember(
              '${escapeHtml(
                member.FamilyMemberID
              )}'
            )
          "
        >

          <div class="family-avatar">
            👤
          </div>


          <div class="family-name">

            ${escapeHtml(
              member.DisplayName ||
              member.FirstName ||
              '-'
            )}

          </div>


          <div class="family-relation">

            ${escapeHtml(
              getRelationshipLabel(
                member.Relationship
              )
            )}

          </div>


          <div class="family-coverage">

            ${
              policies.length
                ? `${policies.length} กรมธรรม์`
                : 'ยังไม่มีกรมธรรม์ใน ANC'
            }

          </div>

        </div>

      `;

    }


    function renderFamilyDetailCard(
      member
    ) {

      const policies =
        getFamilyPolicies(
          member.FamilyMemberID
        );


      return `

        <div class="card">

          <div class="policy-head">

            <div>

              <div class="policy-name">

                ${escapeHtml(
                  member.DisplayName ||
                  member.FirstName ||
                  '-'
                )}

              </div>


              <div class="policy-no">

                ${escapeHtml(
                  getRelationshipLabel(
                    member.Relationship
                  )
                )}

              </div>

            </div>

          </div>


          <div
            class="policy-footer"
            style="
              border-top:0;
              margin-top:10px;
              padding-top:0;
            "
          >

            <div>

              <div class="mini-label">
                วันเกิด
              </div>


              <div class="mini-value">

                ${formatDateDisplay(
                  member.BirthDate
                )}

              </div>

            </div>


            <div>

              <div class="mini-label">
                กรมธรรม์ ANC
              </div>


              <div class="mini-value">

                ${policies.length}

                ฉบับ

              </div>

            </div>

          </div>


          <div class="family-policy-title">

            🛡️ กรมธรรม์ของ
            ${escapeHtml(
              member.DisplayName ||
              member.FirstName ||
              'สมาชิก'
            )}

          </div>


          ${
            policies.length

              ? `
                <div class="policy-list">

                  ${
                    policies
                      .map(
                        renderFamilyPolicyCard
                      )
                      .join('')
                  }

                </div>
              `

              : `
                <div class="empty">
                  ยังไม่มีกรมธรรม์ของสมาชิกนี้
                  ในระบบ ANC
                </div>
              `
          }

        </div>

      `;

    }


    function renderFamilyPolicyCard(
      policy
    ) {

      return `

        <div
          class="policy-card"
          style="
            box-shadow:none;
            border:1px solid #edf1f2;
          "
        >

          <div class="policy-head">

            <div>

              <div class="policy-name">

                ${escapeHtml(
                  policy.PlanName ||
                  '-'
                )}

              </div>


              <div class="policy-no">

                กรมธรรม์
                ${escapeHtml(
                  policy.PolicyNo ||
                  '-'
                )}

              </div>

            </div>


            <div class="policy-status">

              ${escapeHtml(
                translatePolicyStatus(
                  policy.PolicyStatus
                )
              )}

            </div>

          </div>


          ${
            (policy.riders || []).length

              ? `
                <div class="policy-riders">

                  ${
                    policy.riders
                      .map(
                        rider => `

                          <span class="rider-badge">

                            ${escapeHtml(
                              rider.RiderName ||
                              rider.RiderID ||
                              '-'
                            )}

                          </span>

                      )
                      .join('')
                  }

                </div>
              `

              : ''
          }


          <div class="policy-footer">

            <div>

              <div class="mini-label">
                เริ่มคุ้มครอง
              </div>

              <div class="mini-value">

                ${formatDateDisplay(
                  policy.EffectiveDate
                )}

              </div>

            </div>


            <div>

              <div class="mini-label">
                จ่ายครั้งต่อไป
              </div>

              <div class="mini-value">

                ${formatDateDisplay(
                  policy.NextPaymentDate
                )}

              </div>

            </div>

          </div>

        </div>

      `;

    }


    function showFamilyMember(
      familyMemberId
    ) {

      navigateTo(
        'family'
      );

      setTimeout(
        () => {

          const target =
            document.querySelector(
              `[data-family-member="${CSS.escape(
                familyMemberId
              )}"]`
            );

          if (target) {

            target.scrollIntoView({
              behavior: 'smooth',
              block: 'start'
            });

          }

        },
        50
      );

    }


    /* =========================================

        <div class="card">

            <div>

              <div class="mini-label">

              <div class="mini-value">

                  customer.Phone ||

                )}

              </div>

            </div>


            <div>

              <div class="mini-label">

    /* =========================================
       EVENTS
    ========================================= */

    function renderEventCard(
      event
    ) {

      const priority =
        String(
          event.Priority ||
          'INFO'
        ).toLowerCase();


      const remaining =
        Number(
          event.RemainingDays ||
          0
        );


      let dateText =
        formatDateDisplay(
          event.EventDate
        );


      if (
        remaining > 0
      ) {

        dateText +=
          ` · อีก ${remaining} วัน`;

      } else {

        dateText +=
          ' · วันนี้';

      }


      return `

        <div class="event-card">

          <div
            class="
              event-indicator
              ${priority}
            "
          ></div>


          <div class="event-content">

            <div class="event-title">

              ${escapeHtml(
                event.Title ||
                '-'
              )}

            </div>


            <div class="event-description">

              ${escapeHtml(
                event.Description ||
                ''
              )}

            </div>


            <div class="event-date">

              ${escapeHtml(
                dateText
              )}

            </div>

          </div>

        </div>

      `;

    }


    /* =========================================
       REGISTER

    function handleRegister() {

      alert(
        'ขั้นตอนสมัคร Account จะเชื่อมต่อใน Phase ถัดไปครับ'
      );

    }


    /* =========================================
       HELPERS
    ========================================= */

    function formatNumber(
      value
    ) {

      return Number(
        value || 0
      ).toLocaleString(
        'th-TH'
      );

    }


    function formatDateDisplay(
      value
    ) {

      if (!value) {
        return '-';
      }


      const parts =
        String(value)
          .split('-');


      if (
        parts.length !== 3
      ) {

        return String(
          value
        );

      }


      return `${parts[2]}/${parts[1]}/${parts[0]}`;

    }


    function getRelationshipLabel(
      relationship
    ) {

      const labels = {

        SELF:
          'ตัวเอง',

        SPOUSE:
          'คู่สมรส',

        CHILD:
          'บุตร',

        FATHER:
          'บิดา',

        MOTHER:
          'มารดา',

        OTHER:
          'สมาชิกครอบครัว'

      };


      return (
        labels[
          String(
            relationship ||
            ''
          ).toUpperCase()
        ] ||
        'สมาชิกครอบครัว'
      );

    }


    function escapeHtml(
      value
    ) {

      return String(
        value ?? ''
      )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );

    }

  </script>
